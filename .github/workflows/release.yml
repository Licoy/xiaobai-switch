name: Release

on:
  push:
    tags:
      - "v0.*.*"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag vs package.json / tauri.conf / Cargo.toml
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="v$(jq -r .version package.json)"
          TAURI_VERSION="v$(jq -r .version src-tauri/tauri.conf.json)"
          CARGO_VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          LOCK_VERSION="v$(awk '
            $0 == "name = \"xiaobai-switch\"" { found = 1; next }
            found && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' src-tauri/Cargo.lock)"

          echo "tag:          $TAG"
          echo "package.json: $PKG_VERSION"
          echo "tauri.conf:   $TAURI_VERSION"
          echo "Cargo.toml:   $CARGO_VERSION"
          echo "Cargo.lock:   $LOCK_VERSION"

          if [[ "$TAG" != "$PKG_VERSION" || "$TAG" != "$TAURI_VERSION" || "$TAG" != "$CARGO_VERSION" || "$TAG" != "$LOCK_VERSION" ]]; then
            echo "Tag and version files are not consistent. Run: pnpm bump ${TAG#v}"
            exit 1
          fi
          echo "Version $TAG is consistent"

      - name: Validate updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/validate-updater-signing-secret.mjs

  draft-release-notes:
    name: Generate Release Notes
    needs: [check-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header --offline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "XiaoBaiSwitch ${{ github.ref_name }}"
          body: ${{ steps.cliff.outputs.content }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build (${{ matrix.target }})
    needs: [check-version, draft-release-notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            args: --target x86_64-pc-windows-msvc
            msvc_arch: amd64
          # Private repos cannot use the free windows-11-arm label; cross-compile
          # ARM64 from windows-latest. WiX MSI does not support ARM64 — NSIS only.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            args: --target aarch64-pc-windows-msvc --bundles nsis
            msvc_arch: amd64_arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1"
          key: "${{ matrix.os }}-${{ matrix.target }}"
          workspaces: src-tauri -> target

      - name: Configure MSVC for target
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # package.json packageManager is the only pnpm pin (do not also set version:)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "XiaoBaiSwitch ${{ github.ref_name }}"
          includeUpdaterJson: false
          releaseBody: ${{ needs.draft-release-notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Verify macOS app bundle signature
        if: startsWith(matrix.platform, 'macos-')
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/XiaoBaiSwitch.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Sealed Resources version="

      - name: Package Windows portable (zip)
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          # Do not put a trailing comma after Join-Path args — PowerShell
          # treats `Join-Path $dir "a.exe", Join-Path $dir "b.exe"` as one call.
          $releaseDir = Join-Path "src-tauri/target/${{ matrix.target }}" "release"
          Write-Host "PWD=$(Get-Location) releaseDir=$releaseDir"
          $exe = $null
          foreach ($name in @("XiaoBaiSwitch.exe", "xiaobai-switch.exe")) {
            $candidate = Join-Path $releaseDir $name
            if (Test-Path -LiteralPath $candidate) {
              $exe = $candidate
              break
            }
          }
          if (-not $exe) {
            if (Test-Path -LiteralPath $releaseDir) {
              Get-ChildItem -LiteralPath $releaseDir -File | ForEach-Object { Write-Host "file=$($_.Name)" }
            }
            throw "Missing Windows binary under $releaseDir"
          }
          $zipName = "XiaoBaiSwitch_${{ github.ref_name }}_${{ matrix.platform }}-portable.zip"
          Compress-Archive -LiteralPath $exe -DestinationPath $zipName -Force
          Write-Host "Created $zipName from $exe"

      - name: Upload Windows portable to release
        if: startsWith(matrix.platform, 'windows-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: XiaoBaiSwitch_${{ github.ref_name }}_${{ matrix.platform }}-portable.zip

  # Website.yml rebuilds the download page via workflow_run after this
  # workflow succeeds. Do not deploy the site from the version tag — assets
  # are missing until this job publishes the draft.
  publish-release:
    name: Publish Release
    needs: [release, draft-release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate updater manifest
        run: node scripts/generate-updater-manifest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "XiaoBaiSwitch ${{ github.ref_name }}"
          body: ${{ needs.draft-release-notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
